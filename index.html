<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schematic Hub</title>
<style>
:root{
  --bg:#0c0f14; --bg2:#121722; --card:#161c29; --card2:#1c2433; --line:#263044; --text:#e8edf5; --mute:#8d99b0;
  --accent:#3ddc84; --accent2:#1fb866; --accent-ink:#06210f; --danger:#ff5d5d; --heart:#ff5d7a; --radius:14px;
  --shadow:0 10px 30px rgba(0,0,0,.35); --hdr:rgba(12,15,20,.78);
  --vw1:#1a2740; --vw2:#0e131c; --glow1:#16301f; --glow2:#13243a;
}
:root[data-theme="light"]{
  --bg:#f2f5f9; --bg2:#e8edf4; --card:#ffffff; --card2:#f0f4f9; --line:#d5dde8; --text:#17202e; --mute:#5b6980;
  --accent:#1fb866; --accent2:#169a55; --accent-ink:#ffffff; --danger:#d93636; --heart:#e0335a;
  --shadow:0 10px 30px rgba(30,50,80,.12); --hdr:rgba(255,255,255,.82);
  --vw1:#cfe3ff; --vw2:#eaf3ff; --glow1:#d6f3e2; --glow2:#d9e8fb;
}
*{box-sizing:border-box}
html{color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,var(--glow1) 0,transparent 60%),radial-gradient(900px 500px at -10% 10%,var(--glow2) 0,transparent 55%),var(--bg);
  color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;transition:background .2s,color .2s}
a{color:var(--accent);text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:var(--hdr);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:.2px;color:var(--text);cursor:pointer;white-space:nowrap}
.cube{width:26px;height:26px;position:relative}
.cube i{position:absolute;width:12px;height:12px;border-radius:3px}
.cube i:nth-child(1){left:0;top:7px;background:#3ddc84}
.cube i:nth-child(2){left:7px;top:0;background:#7be8ac}
.cube i:nth-child(3){left:14px;top:7px;background:#1fb866}
.cube i:nth-child(4){left:7px;top:14px;background:#2a8f55}
nav{display:flex;gap:2px;margin-left:6px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{padding:8px 13px;border-radius:10px;color:var(--mute);font-weight:600;cursor:pointer;white-space:nowrap}
nav a:hover{background:var(--card);color:var(--text)}
nav a.on{background:var(--card2);color:var(--text)}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;transition:.15s;color:var(--text)}
.btn:hover{background:var(--card2);border-color:#34415a}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{color:var(--danger)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;font-size:17px}
.icon-btn:hover{background:var(--card2)}
.avatar{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.avatar.lg{width:84px;height:84px;font-size:36px}
.userbtn{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700}
.badge2{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:999px;background:var(--heart);color:#fff;font-size:11px;font-weight:800;display:none;place-items:center;padding:0 4px}
.stars{display:inline-flex;gap:2px;font-size:24px;line-height:1;cursor:pointer;user-select:none}
.stars span{color:var(--line);transition:.1s}
.stars span.on{color:#ffc53d}
.stars.ro{cursor:default}
.nitem{display:block;padding:10px 12px;border-radius:9px;color:var(--text)!important;font-weight:500!important}
.nitem.un{background:var(--card2)}
.nitem small{display:block;color:var(--mute)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin:20px 0 40px}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:.18s}
.ccard:hover{transform:translateY(-4px);border-color:#3b4a66;box-shadow:var(--shadow)}
.mosaic{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;aspect-ratio:16/10;gap:2px;background:var(--bg2)}
.mosaic div{background:linear-gradient(160deg,var(--vw1),var(--vw2));overflow:hidden}
.mosaic img{width:100%;height:100%;object-fit:cover;display:block}
.rank{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.rank:hover{background:var(--card2)}
.rank:last-child{border-bottom:0}
.rank .n{width:26px;font-weight:900;color:var(--mute);font-size:18px}
.rank:nth-child(1) .n{color:#ffc53d}.rank:nth-child(2) .n{color:#c0c7d2}.rank:nth-child(3) .n{color:#d08a4a}
.rank img{width:64px;height:48px;object-fit:cover;border-radius:8px;background:var(--bg2)}
.rank .t{flex:1;min-width:0}.rank .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toprow{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;margin:22px 0 50px}
.menu{position:absolute;right:20px;top:58px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:210px;display:none;z-index:30}
.menu.on{display:block}
.menu a,.menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:9px;color:var(--text);background:none;border:0;cursor:pointer;font-weight:600}
.menu a:hover,.menu button:hover{background:var(--card2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.hero{padding:44px 0 18px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:30px;align-items:center}
@media(max-width:900px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(34px,5.5vw,56px);line-height:1.05;margin:0 0 14px;font-weight:900;letter-spacing:-1px}
.hero h1 b{background:linear-gradient(90deg,#3ddc84,#42b8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mute);font-size:18px;max-width:600px;margin:0 0 20px}
.hv{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,var(--vw1),var(--vw2));aspect-ratio:4/3;box-shadow:var(--shadow)}
.hv canvas{width:100%;height:100%;display:block}
.hv .cap{position:absolute;left:12px;bottom:10px;right:12px;display:flex;justify-content:space-between;gap:10px;align-items:end;pointer-events:none}
.hv .cap a{pointer-events:auto;background:rgba(0,0,0,.55);color:#fff;padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px;backdrop-filter:blur(6px)}
.hv .badge{position:absolute;top:12px;left:12px;background:var(--accent);color:var(--accent-ink);padding:4px 10px;border-radius:999px;font-weight:800;font-size:12px}
.statrow{display:flex;gap:26px;flex-wrap:wrap;margin:6px 0 22px}
.statrow div{min-width:90px}
.statrow b{display:block;font-size:26px;letter-spacing:-.5px}
.statrow span{color:var(--mute);font-size:13px}
.search{display:flex;gap:10px;flex-wrap:wrap}
.search input{flex:1;min-width:220px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px;outline:none}
.search input:focus{border-color:var(--accent)}
select{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 8px}
.chip{padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--mute);font-size:14px;cursor:pointer}
.chip:hover,.chip.on{border-color:var(--accent);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:18px;margin:20px 0 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:.18s;display:flex;flex-direction:column;position:relative}
.card:hover{transform:translateY(-4px);border-color:#3b4a66;box-shadow:var(--shadow)}
.thumb{aspect-ratio:4/3;background:linear-gradient(160deg,var(--vw1),var(--vw2));display:grid;place-items:center;position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{color:var(--mute);font-size:13px;opacity:.7}
.lock{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:8px;padding:3px 8px;font-size:12px}
.heart{position:absolute;top:8px;right:8px;display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:999px;padding:5px 11px;cursor:pointer;font-weight:700;font-size:13px;backdrop-filter:blur(6px)}
.heart:hover{background:rgba(0,0,0,.75)}
.heart.on{color:var(--heart)}
.info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.info h3{margin:0;font-size:17px;line-height:1.25}
.meta{color:var(--mute);font-size:13px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.by{display:flex;align-items:center;gap:6px}
.by:hover span{color:var(--accent)}
.empty{padding:60px 0;text-align:center;color:var(--mute)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.detail{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;margin:26px 0 60px}
@media(max-width:860px){.detail{grid-template-columns:1fr}}
.tabs2{display:flex;gap:6px;margin-bottom:12px}
.tabs2 button{padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;color:var(--mute)}
.tabs2 button.on{background:var(--card2);color:var(--text);border-color:var(--accent)}
.viewer{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,var(--vw1),var(--vw2));aspect-ratio:4/3;min-height:300px}
.viewer:fullscreen{aspect-ratio:auto;border-radius:0}
.viewer canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.viewer .hint{position:absolute;bottom:10px;left:12px;font-size:12px;color:var(--mute);pointer-events:none}
.viewer .msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);text-align:center;padding:20px}
.vtools{position:absolute;top:10px;right:10px;display:flex;gap:6px}
.vtools button{width:34px;height:34px;border-radius:9px;border:0;background:rgba(0,0,0,.5);color:#fff;cursor:pointer;font-size:15px;backdrop-filter:blur(6px)}
.vtools button:hover{background:rgba(0,0,0,.72)}
.vtools button.off{opacity:.45}
.clip{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.clip label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);font-weight:600}
.clip input[type=range]{width:160px;accent-color:var(--accent)}
.plan{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:16px}
.plan canvas{max-width:100%;display:block;image-rendering:pixelated;border-radius:8px;border:1px solid var(--line);background:var(--bg2)}
.planwrap{overflow:auto;max-height:560px;position:relative}
.plan .row2{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.plan input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}
.chips2{display:flex;flex-wrap:wrap;gap:4px}
.lc{min-width:30px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--bg2);color:var(--mute);font-size:12px;font-weight:700;cursor:pointer;padding:0 6px}
.lc.d{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lc.c{outline:2px solid #42b8ff;outline-offset:1px}
.cardbar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.35)}
.cardbar i{display:block;height:100%;background:var(--accent)}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 14px;margin-top:12px;font-size:14px}
.legend div{display:flex;align-items:center;gap:8px}
.legend span:last-child{margin-left:auto;color:var(--mute)}
.tip{position:fixed;pointer-events:none;background:rgba(0,0,0,.85);color:#fff;padding:5px 9px;border-radius:8px;font-size:13px;z-index:70;display:none;white-space:nowrap}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
@media(max-width:560px){.photos{grid-template-columns:1fr}}
.photos figure{margin:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);cursor:zoom-in;position:relative;background:var(--bg2)}
.photos img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;transition:transform .25s}
.photos figure:hover img{transform:scale(1.04)}
.photos figcaption{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
h2{margin:0 0 6px;font-size:28px;letter-spacing:-.4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:19px}
.stat span{color:var(--mute);font-size:12px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--mute);cursor:pointer}
.tag:hover{border-color:var(--accent);color:var(--accent)}
ol.steps{padding-left:20px;margin:8px 0;color:var(--mute)}
ol.steps li{margin:4px 0}
code{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:13px;color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:6px 4px;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;color:var(--mute);white-space:nowrap}
.ic{width:22px;height:22px;image-rendering:pixelated;vertical-align:middle;margin-right:8px;border-radius:3px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px;border:1px solid rgba(255,255,255,.15)}
.mats{max-height:360px;overflow:auto}
.mats input[type=checkbox]{margin-right:10px;accent-color:var(--accent);width:16px;height:16px;vertical-align:middle}
tr.done td{opacity:.45;text-decoration:line-through}
.progress{height:8px;background:var(--bg2);border-radius:999px;overflow:hidden;margin:8px 0 12px;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#42b8ff);width:0;transition:width .3s}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--card);border:0;padding:6px 12px;cursor:pointer;font-weight:700;color:var(--mute);font-size:13px}
.seg button.on{background:var(--card2);color:var(--text)}
form.upl{display:grid;gap:16px;max-width:680px;margin:28px 0 60px}
label{display:grid;gap:6px;font-weight:600;font-size:14px}
input[type=text],input[type=password],textarea{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--accent)}
.drop{border:2px dashed #34415a;border-radius:var(--radius);padding:34px;text-align:center;color:var(--mute);cursor:pointer;transition:.15s}
.drop.over,.drop:hover{border-color:var(--accent);color:var(--accent);background:rgba(61,220,132,.05)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.filelist{display:grid;gap:8px}
.fitem{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.fitem .progress{margin:6px 0 0;height:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:50;padding:16px}
.modal.on{display:grid}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;width:min(440px,100%);box-shadow:var(--shadow);max-height:92vh;overflow:auto}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{flex:1}
.err{color:var(--danger);font-size:14px;min-height:20px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:80;display:none}
.mute{color:var(--mute)}
.comments .c{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.comments .c:last-child{border-bottom:0}
.comments .who{font-weight:700}
.comments .when{color:var(--mute);font-size:12px;margin-left:8px;font-weight:400}
.comments .txt{white-space:pre-wrap;word-break:break-word}
.profile{display:flex;gap:22px;align-items:center;flex-wrap:wrap;padding:40px 0 10px}
.bar-top{height:12px;border-radius:999px;overflow:hidden;display:flex;margin:10px 0 4px;border:1px solid var(--line)}
.bar-top i{display:block;height:100%}
.skeleton{background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--radius);height:260px}
@keyframes sk{to{background-position:-200% 0}}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--mute);font-size:14px}
#printarea{display:none}
.tutbox{background:var(--bg2);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;margin:10px 0}
@media print{body>*:not(#printarea){display:none!important}#printarea{display:block!important;color:#000;background:#fff}#printarea .pp{page-break-after:always;break-after:page}#printarea img{max-width:100%;image-rendering:pixelated}#printarea ul{columns:2;font-size:12px}body{background:#fff}}
</style>
</head>
<body>
<header><div class="wrap bar">
  <div class="logo" id="logo"><div class="cube"><i></i><i></i><i></i><i></i></div>Schematic Hub</div>
  <nav>
    <a data-nav="#/">Entdecken</a><a data-nav="#/top">Rangliste</a><a data-nav="#/collections">Sammlungen</a><a data-nav="#/feed">Feed</a><a data-nav="#/upload">Hochladen</a><a data-nav="#/mod">Blueprint-Mod</a>
  </nav>
  <div class="sp"></div>
  <button class="icon-btn" id="bell" title="Benachrichtigungen" style="display:none;position:relative">🔔<span id="badge" class="badge2"></span></button>
  <button class="icon-btn" id="lang" title="Sprache / Language" style="font-size:13px;font-weight:800">EN</button><button class="icon-btn" id="theme" title="Hell/Dunkel">☾</button>
  <div id="auth"></div>
</div>
<div class="menu" id="menu"></div><div class="menu" id="nmenu" style="width:340px;max-height:70vh;overflow:auto"></div></header>
<main class="wrap" id="app"></main>
<footer><div class="wrap">Schematic Hub &middot; Baupl&auml;ne f&uuml;r Minecraft mit Litematica &middot; Lade nur Dateien hoch, die du teilen darfst. &middot; Tipp: Mit <code>/</code> springst du zur Suche.</div></footer>

<div class="modal" id="modal"><div class="box">
  <div class="tabs"><button class="btn pri" id="tab-login">Einloggen</button><button class="btn" id="tab-reg">Konto erstellen</button></div>
  <form id="authform" autocomplete="on">
    <label>Name<input type="text" id="a-name" autocomplete="username" maxlength="20" required></label>
    <label style="margin-top:12px">Passwort<input type="password" id="a-pass" autocomplete="current-password" minlength="8" required></label>
    <label id="a-invite-row" style="margin-top:12px;display:none">Einladungscode<input type="text" id="a-invite" autocomplete="off"></label>
    <div class="err" id="a-err"></div>
    <div class="row" style="margin-top:6px"><button class="btn pri" id="a-submit" type="submit">Einloggen</button><button class="btn" type="button" id="a-cancel">Abbrechen</button></div>
  </form>
</div></div>
<div class="modal" id="modal2"><div class="box" id="box2"></div></div>
<div id="printarea"></div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>
<script src="/static/three.min.js"></script>

"use strict";

async function api(path, opts={}) {
  const o = Object.assign({method:'GET', headers:{}}, opts);
  if (o.method !== 'GET') o.headers['X-Requested-With'] = 'hub';
  let r;
  try { r = await fetch(path, o); }
  catch (e) { throw new Error('Der Server ist nicht erreichbar. Läuft das Fenster von Start.command noch? Sonst nochmal starten und diese Seite neu laden.'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Fehler ' + r.status);
  return data;
}

function ago(t){ const s=Math.max(1,Math.floor(Date.now()/1000-t)); if(s<60) return 'gerade eben'; if(s<3600) return 'vor '+Math.floor(s/60)+' Min'; if(s<86400) return 'vor '+Math.floor(s/3600)+' Std'; if(s<86400*30) return 'vor '+Math.floor(s/86400)+' Tagen'; return fmtDate(t); }

function countUp(el, to){ const t0=performance.now(); (function f(t){ const k=Math.min(1,(t-t0)/700); el.textContent=num(Math.round(to*(1-Math.pow(1-k,3)))); if(k<1) requestAnimationFrame(f); })(t0); }

const EN = {};      // wird unten gefuellt: deutscher Text -> englischer Text
const PATS = [];    // [RegExp, Funktion] fuer Texte mit Zahlen
const missing = new Set();
function trText(s){
  if (EN[s] !== undefined) return EN[s];
  for (const [re, fn] of PATS){ const m = s.match(re); if (m) return fn(m); }
  return null;
}
function trString(s){ if (LANG !== 'en') return s; const lead = s.match(/^\s*/)[0], tail = s.match(/\s*$/)[0]; const core = s.trim(); if (!core) return s; const t = trText(core); return t === null ? s : lead + t + tail; }
const ATTRS = ['placeholder','title','alt','aria-label'];
function translateNode(n){
  if (n.nodeType === 3) {
    const p = n.parentNode; if (!p || /^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName)) return;
    if (n.__en !== undefined && n.nodeValue === n.__en) { if (LANG !== 'en') { n.nodeValue = n.__de; delete n.__en; } return; }
    const orig = n.nodeValue; if (!orig.trim()) return;
    if (LANG !== 'en') return;
    const t = trString(orig);
    if (t === orig) { const c = orig.trim(); if (/[A-Za-zÄÖÜäöüß]{3,}/.test(c)) missing.add(c); return; }
    n.__de = orig; n.__en = t; n.nodeValue = t;
  } else if (n.nodeType === 1) {
    if (/^(SCRIPT|STYLE)$/.test(n.nodeName)) return;
    for (const a of ATTRS) { if (!n.hasAttribute(a)) continue; const key='data-de-'+a; if (!n.hasAttribute(key)) { if (LANG==='en') { const v=n.getAttribute(a); const t=trString(v); if (t!==v) { n.setAttribute(key, v); n.setAttribute(a, t); } else if (/[A-Za-z]{3,}/.test(v)) missing.add(v); } } else { const orig=n.getAttribute(key); if (LANG==='en') { const t=trString(orig); if (n.getAttribute(a)!==t) n.setAttribute(a,t); } else { n.setAttribute(a, orig); n.removeAttribute(key); } } }
    for (const c of n.childNodes) translateNode(c);
  }
}

// ---------------------------------------------------------------- 3D (echte Minecraft-Bloecke)
const TINTS = {grass:'#91bd59', foliage:'#77ab2f', birch:'#80a755', spruce:'#619961', water:'#3f76e4', redstone:'#d02010', lily:'#208030', stem:'#7ec23c'};
const imgCache = new Map();
function loadImg(path){
  if (!imgCache.has(path)) imgCache.set(path, new Promise(res=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>res(null); i.src='/tex/'+path+'.png'; }));
  return imgCache.get(path);
}
// Eine Kachel (16x16) aus "block/name" oder "block/name@tint"
async function tileCanvas(spec){
  const [path0, tint] = spec.split('@'); const [path, crop] = path0.split('#');
  const img = await loadImg(path);
  const c = document.createElement('canvas'); c.width = c.height = 16;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  if (!img){ x.fillStyle='#b0b'; x.fillRect(0,0,16,16); x.fillStyle='#222'; x.fillRect(0,0,8,8); x.fillRect(8,8,8,8); return c; }

  if (crop) { [cx,cy,cw,ch] = crop.split(',').map(Number); }
  x.drawImage(img, cx, cy, cw, ch, 0, 0, 16, 16);
  if (tint && TINTS[tint]){
    x.globalCompositeOperation = 'multiply'; x.fillStyle = TINTS[tint]; x.fillRect(0,0,16,16);
    x.globalCompositeOperation = 'destination-in'; x.drawImage(img, cx, cy, cw, ch, 0, 0, 16, 16);
  }
  return c;
}
const atlasCache = new WeakMap();
async function buildAtlas(data){
  if (atlasCache.has(data)) return atlasCache.get(data);
  const n = data.tex.length + 1, cols = 16, rows = Math.ceil(n / cols);
  const c = document.createElement('canvas'); c.width = cols*16; c.height = rows*16;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,16,16);   // Kachel 0 = weiss (Farbwuerfel)
  const tiles = await Promise.all(data.tex.map(tileCanvas));
  tiles.forEach((t,i)=>{ const k=i+1; x.drawImage(t, (k%cols)*16, Math.floor(k/cols)*16); });
  const tex = new THREE.CanvasTexture(c); tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter; tex.generateMipmaps = false;
  const out = {tex, W:c.width, H:c.height, cols};
  atlasCache.set(data, out); return out;
}
const DIRS = {up:[0,1,0], down:[0,-1,0], north:[0,0,-1], south:[0,0,1], west:[-1,0,0], east:[1,0,0]};
// Ecke (a,b) einer Flaeche: a = u-Richtung, b = v-Richtung (wie bei Minecraft)
function faceCorner(d, f, t, a, b){
  switch(d){
    case 'up':    return [a?t[0]:f[0], t[1], b?t[2]:f[2]];
    case 'down':  return [a?t[0]:f[0], f[1], b?f[2]:t[2]];
    case 'north': return [a?f[0]:t[0], b?f[1]:t[1], f[2]];
    case 'south': return [a?t[0]:f[0], b?f[1]:t[1], t[2]];
    case 'west':  return [f[0], b?f[1]:t[1], a?t[2]:f[2]];
    default:      return [t[0], b?f[1]:t[1], a?f[2]:t[2]];
  }
}
function defaultUV(d, f, t){
  switch(d){
    case 'up': return [f[0], f[2], t[0], t[2]];
    case 'down': return [f[0], 16-t[2], t[0], 16-f[2]];
    case 'north': return [16-t[0], 16-t[1], 16-f[0], 16-f[1]];
    case 'south': return [f[0], 16-t[1], t[0], 16-f[1]];
    case 'west': return [f[2], 16-t[1], t[2], 16-f[1]];
    default: return [16-t[2], 16-t[1], 16-f[2], 16-f[1]];
  }
}
function rotAxis(p, axis, deg){   // Standard-Drehung um eine Achse durch den Ursprung
  const r = deg*Math.PI/180, c = Math.cos(r), s = Math.sin(r); let [x,y,z] = p;
  if (axis==='x') return [x, y*c - z*s, y*s + z*c];
  if (axis==='y') return [x*c + z*s, y, -x*s + z*c];
  return [x*c - y*s, x*s + y*c, z];
}
function modelRot(p, mx, my){      // Minecraft: erst x, dann y; positive Winkel = Standard-Drehung um -Winkel
  let q = [p[0]-8, p[1]-8, p[2]-8];
  if (mx) q = rotAxis(q, 'x', -mx);
  if (my) q = rotAxis(q, 'y', -my);
  return [q[0]+8, q[1]+8, q[2]+8];
}
function rotDir(v, mx, my){

function makeViewer(host, data, opts={}){

let thumbRenderer=null; const thumbCache=new Map(); let thumbChain=Promise.resolve();
function thumbFor(id){
  if (thumbCache.has(id)) return thumbCache.get(id);
  const p = thumbChain.then(async()=>{
    const data = await (await fetch('/api/schematics/'+id+'/preview')).json();
    if (!thumbRenderer){ const c=document.createElement('canvas'); c.width=480; c.height=360; thumbRenderer=new THREE.WebGLRenderer({canvas:c,antialias:true,alpha:true,preserveDrawingBuffer:true}); thumbRenderer.setSize(480,360,false); }
    const {scene,center,radius}=await buildScene(data);
    const cam=new THREE.PerspectiveCamera(40,480/360,0.1,2000); const d=radius*2.2+4;
    cam.position.set(center.x+d*0.62, center.y+d*0.5, center.z+d*0.78); cam.lookAt(center);
    thumbRenderer.render(scene,cam);
    const url = thumbRenderer.domElement.toDataURL('image/png');
    scene.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose(); });
    return url;

    const v = rotDir(DIRS[d], m.x, m.y);
    if (v[1] !== 1) continue;                       // Flaeche, die nach der Drehung nach oben zeigt
    const a = (e.t[0]-e.f[0]) * (e.t[2]-e.f[2]);
    if (a > area) { area = a; best = e.fc[d].t; }
  }
  if (best === null) { const f = Object.values(st.m[0].e[0].fc)[0]; best = f.t; }
  return data.tex[best];
}
function fillIcon(canvas, data, name){
  const si = data.icons && data.icons[name];
  if (si === undefined) return false;
  tileP(data.tex[si]).then(t => { canvas.getContext('2d').drawImage(t, 0, 0); });
  return true;
}

async function renderPlan(box, id, s, data){

  // Zeichnet eine Ebene auf ein Canvas; hlName hebt eine Blockart hervor
  async function paint(cv, L, cs, hlName){
    const w=L.w, d=L.d, m=26;
    cv.width = m + w*cs; cv.height = m + d*cs;
    const x = cv.getContext('2d'); x.imageSmoothingEnabled = false;
    const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n);
    x.fillStyle = cssv('--bg2'); x.fillRect(0,0,cv.width,cv.height);
    const counts = {}, specs = new Map();
    for (let i=0;i<L.c.length;i++){ const g=L.c[i]; if (g===65535) continue; if(!specs.has(g)) specs.set(g, topSpec(data,g)); const n=(data.palette[g]||{}).n||'?'; counts[n]=(counts[n]||0)+1; }
    const tiles = new Map();
    await Promise.all([...specs.entries()].map(async([g,sp])=>{ if (sp) tiles.set(g, await tileP(sp)); }));
    for (let zz=0; zz<d; zz++) for (let xx=0; xx<w; xx++){
      const g = L.c[zz*w+xx]; const px = m+xx*cs, py = m+zz*cs;
      if (g===65535) { x.fillStyle = ((xx+zz)&1) ? 'rgba(128,140,160,.10)' : 'rgba(128,140,160,.05)'; x.fillRect(px,py,cs,cs); continue; }
      const t = tiles.get(g);
      if (t) x.drawImage(t, px, py, cs, cs); else { x.fillStyle = '#'+((data.palette[g]||{}).c||'888888'); x.fillRect(px,py,cs,cs); }
      if (hlName) { const isHl = (data.palette[g]||{}).n === hlName; if (!isHl) { x.fillStyle='rgba(8,12,20,.62)'; x.fillRect(px,py,cs,cs); } }
    }
    x.strokeStyle = 'rgba(0,0,0,.28)'; x.lineWidth = 1; x.beginPath();
    for (let i=0;i<=w;i++){ x.moveTo(m+i*cs+.5, m); x.lineTo(m+i*cs+.5, m+d*cs); }
    for (let i=0;i<=d;i++){ x.moveTo(m, m+i*cs+.5); x.lineTo(m+w*cs, m+i*cs+.5); }
    x.stroke();
    x.strokeStyle = 'rgba(255,255,255,.55)'; x.beginPath();
    for (let i=0;i<=w;i+=5){ x.moveTo(m+i*cs+.5, m); x.lineTo(m+i*cs+.5, m+d*cs); }
    for (let i=0;i<=d;i+=5){ x.moveTo(m, m+i*cs+.5); x.lineTo(m+w*cs, m+i*cs+.5); }
    x.stroke();
    if (hlName) { x.strokeStyle='#ffd400'; x.lineWidth=2; for (let zz=0; zz<d; zz++) for (let xx=0; xx<w; xx++){ const g=L.c[zz*w+xx]; if (g!==65535 && (data.palette[g]||{}).n===hlName) x.strokeRect(m+xx*cs+1, m+zz*cs+1, cs-2, cs-2); } }
    x.fillStyle = cssv('--mute'); x.font = '11px sans-serif'; x.textAlign='center';
    for (let i=0;i<w;i+=5) x.fillText(i, m+i*cs+cs/2, 16);
    x.textAlign='right'; for (let i=0;i<d;i+=5) x.fillText(i, m-5, m+i*cs+cs/2+4);
    return counts;
  }
  const cellSize = w => Math.max(8, Math.min(28, Math.floor(860/w)));

      const tip=$('#tip'); if (cx<0||cz<0||cx>=w||cz>=d){ tip.style.display='none'; return; } const g=L.c[cz*w+cx];
      tip.textContent = (g===65535 ? 'Luft' : nice((data.palette[g]||{}).n||'?')) + '  ('+cx+', '+y+', '+cz+')'; tip.style.display='block'; tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+14)+'px'; };
    cv.onmouseleave = ()=>{ $('#tip').style.display='none'; };
  }
  $('#pl-range').oninput = e => { hl=null; show(+e.target.value-1); };
  $('#pl-prev').onclick = () => { if (cur>0) { hl=null; show(cur-1); } };

  $('#pl-png').onclick = () => { $('#pl-canvas').toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=s.title.replace(/[^A-Za-z0-9_-]+/g,'_')+'_ebene_'+(cur+1)+'.png'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }); };

  // ---- Alle Ebenen drucken
  $('#pl-print').onclick = async () => {
    const btn = $('#pl-print'); btn.disabled = true; const old = btn.textContent;
    try {
      let html = `<h1>${esc(s.title)}</h1><p>${s.dims.join(' × ')} Blöcke &middot; ${num(s.blocks)} Blöcke insgesamt &middot; Ansicht von oben, Norden ist oben</p>`;
      for (let y=0; y<sy; y++){
        btn.textContent = 'Ebene '+(y+1)+'/'+sy+' …';
        const L = await layer(y); const c = document.createElement('canvas'); const counts = await paint(c, L, cellSize(L.w), null);
        const rows = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
        html += `<section class="pp"><h2>Ebene ${y+1} von ${sy}</h2><img src="${c.toDataURL('image/png')}" alt=""><ul>${rows.map(([n,k])=>`<li>${num(k)} × ${esc(nice(n))}</li>`).join('') || '<li>leer</li>'}</ul></section>`;
      }
      $('#printarea').innerHTML = html; await new Promise(r=>setTimeout(r,300)); window.print();
    } catch(e){ toast(e.message); }
    btn.disabled = false; btn.textContent = old;
  };

  // ---- Schritt-fuer-Schritt-Anleitung
  let steps = null, si = 0;
  async function buildSteps(){
    const out = [];
    for (let y=0; y<sy; y++){
      $('#tutbox').innerHTML = '<span class="mute">Anleitung wird vorbereitet … Ebene '+(y+1)+'/'+sy+'</span>';
      const L = await layer(y); const counts = {};
      for (const g of L.c){ if (g===65535) continue; const n=(data.palette[g]||{}).n||'?'; counts[n]=(counts[n]||0)+1; }
      // Erst die Bloecke mit den meisten Stuecken, dann der Rest
      Object.entries(counts).sort((a,b)=>b[1]-a[1]).forEach(([n,c])=>out.push({y, n, c}));
    }
    return out;
  }
  function showStep(){
    const st = steps[si]; hl = st.n; show(st.y);
    $('#tutbox').innerHTML = `<div class="row" style="justify-content:space-between"><div class="row"><canvas class="ic" id="tt-ic" width="16" height="16"></canvas><b>Schritt ${si+1} von ${steps.length}:</b> <span>Ebene ${st.y+1} &middot; ${num(st.c)} &times; ${esc(nice(st.n))}</span></div><div class="row"><button class="btn sm" id="tt-prev">&larr; Zur&uuml;ck</button><button class="btn sm pri" id="tt-next">Weiter &rarr;</button><button class="btn sm" id="tt-end">Beenden</button></div></div>
      <div class="progress" style="margin:8px 0 0"><i style="width:${Math.round(100*(si+1)/steps.length)}%"></i></div><div class="mute" style="font-size:13px;margin-top:6px">Gelb umrandet sind die Felder, auf die du diesen Block jetzt setzt. Tasten: &larr; &rarr;</div>`;
    fillIcon($('#tt-ic'), data, st.n);
    $('#tt-prev').onclick = () => { if (si>0){ si--; showStep(); } };
    $('#tt-next').onclick = () => { if (si<steps.length-1){ si++; showStep(); } else { toast('Geschafft! Alle Schritte durch.'); endTut(); } };
    $('#tt-end').onclick = endTut;
  }
  function endTut(){ steps=null; hl=null; $('#tutbox').style.display='none'; $('#pl-tut').textContent='Schritt-für-Schritt-Anleitung'; show(cur); }
  $('#pl-tut').onclick = async () => {
    if (steps) { endTut(); return; }
    $('#tutbox').style.display='block'; $('#pl-tut').textContent='Anleitung beenden';
    steps = await buildSteps(); si = 0;
    if (!steps.length) { endTut(); return; }
    showStep();
  };
  box.tabIndex = 0;
  box.addEventListener('keydown', e=>{ if(!steps) return; if (e.key==='ArrowRight') $('#tt-next').click(); if (e.key==='ArrowLeft') $('#tt-prev').click(); });
  show(0);
}

// ---------------------------------------------------------------- Automatische Fotos aus dem Inneren der Base
const photoCache = new Map();
function findSpots(data){
  const [sx,sy,sz] = data.size; const pal = data.palette;
  const key = (x,y,z) => (x*sy + y)*sz + z;
  const solid = new Map(); const list = [];
  const TERRAIN = new Set(['dirt','grass_block','coarse_dirt','podzol','mycelium','rooted_dirt','bedrock','deepslate','stone','sand','red_sand','gravel','tuff','netherrack','clay','mud','dirt_path','farmland','snow_block','ice']);
  const n = data.v.length/4;
  for (let i=0;i<n;i++){ const g=data.v[4*i+3], st=pal[g]; if (!(st.o || st.tr)) continue; const x=data.v[4*i], y=data.v[4*i+1], z=data.v[4*i+2]; solid.set(key(x,y,z), g); list.push([x,y,z]); }
  const S = (x,y,z) => solid.has(key(x,y,z));
  const isTerrain = (x,y,z) => { const g=solid.get(key(x,y,z)); return g!==undefined && TERRAIN.has((pal[g]||{}).n); };
  const dirs = []; for (let a=0;a<16;a++){ const t=a*Math.PI/8; dirs.push([Math.cos(t), Math.sin(t)]); }
  const cands = [];
  for (const [x,y,z] of list){
    if (S(x,y+1,z) || S(x,y+2,z) || S(x,y+3,z)) continue;        // 2 Bloecke Platz ueber dem Boden
    const cx=x+0.5, cz=z+0.5, ey=y+2;                            // Augenhoehe liegt im Block y+2
    let ceiling=false, ceilTerrain=false; for (let k=3;k<=9;k++) if (S(x,y+k,z)) { ceiling=true; ceilTerrain=isTerrain(x,y+k,z); break; }
    if (!ceiling || ceilTerrain || isTerrain(x,y,z)) continue;   // kein Raum im Boden oder Fels
    let terr = 0;
    const dist = dirs.map(([dx,dz])=>{ for (let k=0.5;k<=14;k+=0.5){ const bx=Math.floor(cx+dx*k), bz=Math.floor(cz+dz*k); if (S(bx, ey, bz) || S(bx, y+1, bz)) { if (isTerrain(bx, ey, bz) || isTerrain(bx, y+1, bz)) terr++; return k; } } return 15; });
    if (terr > 3) continue;
    const hits = dist.filter(d=>d<15).length;
    if (hits < 13) continue;                                     // wirklich in einem geschlossenen Raum
    if (Math.min(...dist) < 1.4) continue;                       // nicht direkt an der Wand
    // Blickrichtung: die mit der groessten Raumtiefe in einem 60-Grad-Faecher
    let bestA=-1, bestS=-1; for (let a=0;a<16;a++){ let sc=0, open=false; for (let o=-2;o<=2;o++){ const d=dist[(a+o+16)%16]; if (d>=15) open=true; sc+=Math.min(d,12); } if (!open && sc>bestS){ bestS=sc; bestA=a; } }
    if (bestA<0) continue;                                       // Blick darf nirgends ins Freie gehen
    const total = dist.reduce((s,d)=>s+Math.min(d,12),0);
    // Mehr Raumtiefe ist besser, aber nicht riesig und leer
    cands.push({x:cx, y:y+1, z:cz, a:bestA, score: total + bestS*0.5 + Math.random()*0.01});
  }
  cands.sort((p,q)=>q.score-p.score);
  const out = [];
  const far = Math.max(6, 0.22*Math.max(sx,sz));
  for (const c of cands){
    if (out.every(o=>Math.hypot(o.x-c.x,o.z-c.z) >= far || Math.abs(o.y-c.y) >= 4)) { out.push(c); if (out.length===2) break; }
  }
  return out.map(c=>({pos:[c.x, c.y+1.62, c.z], ang:c.a*Math.PI/8}));
}

const FEATURES = {crafting_table:3, enchanting_table:3, beacon:3, furnace:2.5, blast_furnace:2.5, smoker:2.5, anvil:2.5, chipped_anvil:2.5, damaged_anvil:2.5,
  smithing_table:2.5, brewing_stand:2.5, chest:2, trapped_chest:2, barrel:2, ender_chest:2, respawn_anchor:2, lectern:1.5, loom:1.5, grindstone:1.5,
  stonecutter:1.5, cartography_table:1.5, fletching_table:1.5, cauldron:1.5, jukebox:1.5, lodestone:1.5, bell:1.5, campfire:1.5, bookshelf:1, composter:1, hopper:1, dispenser:1, dropper:1};
function featureWeight(name){ if (!name) return 0; if (FEATURES[name]) return FEATURES[name]; if (name.endsWith('_bed')) return 1.5; if (name.endsWith('shulker_box')) return 1.5; return 0; }
// Sucht Kamerastandorte in geschlossenen Raeumen, von denen aus moeglichst viele "interessante" Bloecke (Werkbank, Ofen, Amboss, Truhen ...) zu sehen sind
function findFeatureSpots(data){
  const [sx,sy,sz] = data.size; const pal = data.palette;
  const key = (x,y,z) => (x*sy + y)*sz + z;
  const solid = new Map(); const feats = [];
  const n = data.v.length/4;
  for (let i=0;i<n;i++){ const g=data.v[4*i+3], st=pal[g]; const x=data.v[4*i], y=data.v[4*i+1], z=data.v[4*i+2];
    const w = featureWeight(st.n); if (w>0) feats.push({x,y,z,w,name:st.n});
    if (st.o || st.tr) solid.set(key(x,y,z), g); }
  if (!feats.length) return [];
  const TERRAIN = new Set(['dirt','grass_block','coarse_dirt','podzol','mycelium','rooted_dirt','bedrock','deepslate','stone','sand','red_sand','gravel','tuff','netherrack','clay','mud','dirt_path','farmland','snow_block','ice']);
  const S = (x,y,z) => solid.has(key(x,y,z));
  const isT = (x,y,z) => { const g=solid.get(key(x,y,z)); return g!==undefined && TERRAIN.has((pal[g]||{}).n); };
  feats.sort((a,b)=>b.w-a.w); const F = feats.slice(0, 300);
  const seen = new Set(), cands = [];
  for (const f of F){
    for (let dx=-8; dx<=8; dx++) for (let dz=-8; dz<=8; dz++) for (let dy=-2; dy<=1; dy++){
      const cx=f.x+dx, cy=f.y+dy, cz=f.z+dz; if (cx<0||cz<0||cy<1||cx>=sx||cz>=sz) continue;
      const k = key(cx,cy,cz); if (seen.has(k)) continue; seen.add(k);
      if (!S(cx,cy-1,cz) || S(cx,cy,cz) || S(cx,cy+1,cz) || S(cx,cy+2,cz) || isT(cx,cy-1,cz)) continue;
      let ceil=false, ceilT=false; for (let q=3;q<=9;q++) if (S(cx,cy+q,cz)) { ceil=true; ceilT=isT(cx,cy+q,cz); break; }
      if (!ceil || ceilT) continue;
      cands.push([cx,cy,cz]);
    }
  }
  const res = [];
  for (const [cx,cy,cz] of cands){
    const ex=cx+0.5, ey=cy+1.62, ez=cz+0.5;
    const vis = [];
    for (const f of F){
      const dx=f.x+0.5-ex, dy=f.y+0.5-ey, dz=f.z+0.5-ez, d=Math.hypot(dx,dz);
      if (d<1.6 || d>10 || Math.abs(dy)>5) continue;
      let blocked=false; const steps=Math.ceil(Math.hypot(dx,dy,dz)/0.4);
      for (let s=1; s<steps-1 && !blocked; s++){ const t=s/steps; const bx=Math.floor(ex+dx*t), by=Math.floor(ey+dy*t), bz=Math.floor(ez+dz*t); if (S(bx,by,bz) && !(bx===f.x&&by===f.y&&bz===f.z)) blocked=true; }
      if (!blocked) vis.push({f, ang:Math.atan2(dz,dx), d, el:Math.atan2(dy,d)});
    }
    if (!vis.length) continue;
    let best=null;
    for (let a=0;a<16;a++){ const h=a*Math.PI/8; let sc=0, set=[]; const cnt={};
      vis.sort((p,q)=>q.f.w-p.f.w);
      for (const v of vis){ let da=Math.abs(v.ang-h); da=Math.min(da, 2*Math.PI-da); if (da>0.7 || v.el<-0.6 || v.el>0.55) continue;
        cnt[v.f.name]=(cnt[v.f.name]||0)+1; if (cnt[v.f.name]>3) continue;          // gleiche Bloecke zaehlen nur bis 3x
        sc += v.f.w * (v.d>=2.5 && v.d<=8 ? 1 : 0.6); set.push(v.f); }
      if (!best || sc>best.sc) best={sc, set, h};
    }
    if (best && best.sc>0) { best.sc += new Set(best.set.map(f=>f.name)).size * 1.5; res.push({cx,cy,cz,ex,ey,ez,...best}); }
  }
  res.sort((a,b)=>b.sc-a.sc);
  const out = [];
  for (const r of res){
    const ids = new Set(r.set.map(f=>f.x+','+f.y+','+f.z));
    const ok = out.every(o=>{ const fresh = r.set.filter(f=>!o.ids.has(f.x+','+f.y+','+f.z)).reduce((s,f)=>s+f.w,0); return fresh >= 0.5*r.sc && Math.hypot(o.cx-r.cx,o.cz-r.cz) >= 3; });
    if (!ok) continue;
    r.ids = ids; out.push(r); if (out.length===2) break;
  }
  return out.map(r=>{
    let cxx=0, cyy=0, czz=0, w=0; for (const f of r.set){ cxx+=(f.x+0.5)*f.w; cyy+=(f.y+0.5)*f.w; czz+=(f.z+0.5)*f.w; w+=f.w; }
    const names = [...new Set(r.set.sort((a,b)=>b.w-a.w).map(f=>nice(f.name)))].slice(0,3);
    return {pos:[r.ex,r.ey,r.ez], look:[cxx/w, cyy/w, czz/w], label:'Mit '+names.join(', '), cx:r.cx, cz:r.cz, cy:r.cy};
  });
}
let photoRenderer = null;
async function takePhotos(data, id){
  if (photoCache.has(id)) return photoCache.get(id);
  const p = (async()=>{
    const {scene, grid, center, radius} = await buildScene(data);
    grid.visible = false; scene.background = new THREE.Color(0x9ec8ff);
    if (!photoRenderer){ const c=document.createElement('canvas'); c.width=960; c.height=540; photoRenderer=new THREE.WebGLRenderer({canvas:c,antialias:true,preserveDrawingBuffer:true}); photoRenderer.setSize(960,540,false); }
    const shots = [];
    let spots = findFeatureSpots(data);
    if (spots.length < 2) {
      for (const s of findSpots(data)) {
        if (spots.length >= 2) break;
        if (spots.some(o=>Math.hypot(o.pos[0]-s.pos[0], o.pos[2]-s.pos[2]) < 5)) continue;
        spots.push({pos:s.pos, look:[s.pos[0]+Math.cos(s.ang)*10, s.pos[1]-0.9, s.pos[2]+Math.sin(s.ang)*10], label:'Von innen'});
      }
    }
    for (const s of spots){
      const cam = new THREE.PerspectiveCamera(78, 16/9, 0.05, 500);
      cam.position.set(s.pos[0], s.pos[1], s.pos[2]);
      cam.lookAt(s.look[0], s.look[1], s.look[2]);
      photoRenderer.render(scene, cam);
      shots.push({url: photoRenderer.domElement.toDataURL('image/jpeg', 0.9), label: s.label});
    }
    // Aussenansichten aus vier Richtungen
    const ext = [[0.8,0.5],[2.4,0.42],[3.95,0.5],[5.5,0.42]];
    for (const [az, el] of ext){
      const cam = new THREE.PerspectiveCamera(45, 16/9, 0.1, 2000); const d=radius*2.0+4;
      cam.position.set(center.x+d*Math.cos(az)*Math.cos(el), center.y+d*Math.sin(el)+radius*0.2, center.z+d*Math.sin(az)*Math.cos(el)); cam.lookAt(center);
      grid.visible = true; photoRenderer.render(scene, cam);
      shots.push({url: photoRenderer.domElement.toDataURL('image/jpeg', 0.88), label: 'Au\u00dfenansicht'});
    }
    scene.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose(); });
    return shots;
  })().catch(()=>[]);
  photoCache.set(id, p); return p;
}

let thumbObserver = null;
function lazyThumbs(items){
  if (!thumbObserver) thumbObserver = new IntersectionObserver(es=>es.forEach(e=>{ if(!e.isIntersecting) return; thumbObserver.unobserve(e.target);
    const id=+e.target.id.slice(2); const lock = (e.target.querySelector('.lock')?.outerHTML || '') + (e.target.querySelector('.cardbar')?.outerHTML || '');
    thumbFor(id).then(url=>{ if(url && e.target.isConnected) e.target.innerHTML = '<img alt="" src="'+url+'">'+lock; });
  }),{rootMargin:'200px'});
  items.forEach(s=>{ const el=$('#th'+s.id); if(el && s.has_preview && !s.cover) thumbObserver.observe(el); });
}

  let mode = 'count'; const panel = $('#matpanel');

    $('#m-copy').onclick = ()=>copyText(s.title+'\n'+s.materials.map(m=>m[1]+'x '+nice(m[0])).join('\n'), 'Materialliste kopiert');

    if (data) $$('canvas.ic[data-b]', panel).forEach(c=>{ if(!fillIcon(c, data, c.dataset.b)) c.style.display='none'; });
  }
  draw(); return draw;
}

  $('#app').innerHTML = `<h2 style="margin-top:34px">Schematics hochladen</h2><form class="upl" id="uf">
    <div class="drop" id="drop"><b id="dtxt">.litematic hierher ziehen oder klicken</b><div style="font-size:13px;margin-top:6px">.litematic, .schem (WorldEdit) oder .nbt &middot; auch mehrere auf einmal &middot; je bis 25 MB</div></div><input type="file" id="file" accept=".litematic,.schem,.nbt" multiple hidden>
    <div class="filelist" id="flist"></div>
    <label id="titlerow">Titel<input type="text" id="u-title" maxlength="80"></label>
    <label>Beschreibung (f&uuml;r alle gew&auml;hlten Dateien)<textarea id="u-desc" rows="4" maxlength="2000"></textarea></label>
    <label>Tags (mit Komma getrennt)<input type="text" id="u-tags" placeholder="haus, mittelalter, deko"></label>
    <label class="row" style="grid-auto-flow:column;justify-content:start"><input type="checkbox" id="u-pub" checked> F&uuml;r alle sichtbar</label>
    <div class="err" id="u-err"></div><div class="row"><button class="btn pri" id="u-go" type="submit">Hochladen</button></div></form>`;
  let files = []; const drop=$('#drop'), inp=$('#file');
  function pick(list){
    const ok = [...list].filter(f=>/\.(litematic|schem|nbt)$/i.test(f.name));
    if (!ok.length){ $('#u-err').textContent='Nur .litematic-, .schem- oder .nbt-Dateien.'; return; }
    files = ok; $('#u-err').textContent='';
    $('#dtxt').textContent = ok.length===1 ? ok[0].name+' ('+fmtSize(ok[0].size)+')' : ok.length+' Dateien gewählt';
    $('#flist').innerHTML = ok.length>1 ? ok.map((f,i)=>`<div class="fitem" id="fi${i}">${esc(f.name)} <span class="mute">(${fmtSize(f.size)})</span><div class="progress"><i></i></div></div>`).join('') : '<div class="progress" id="p1" style="display:none"><i></i></div>';
    $('#titlerow').style.display = ok.length>1 ? 'none' : '';
    if (ok.length===1 && !$('#u-title').value) $('#u-title').value = ok[0].name.replace(/\.(litematic|schem|nbt)$/i,'').replace(/[_-]+/g,' ');
  }
  drop.onclick=()=>inp.click(); inp.onchange=()=>pick(inp.files);
  drop.ondragover=e=>{e.preventDefault(); drop.classList.add('over');}; drop.ondragleave=()=>drop.classList.remove('over');
  drop.ondrop=e=>{e.preventDefault(); drop.classList.remove('over'); pick(e.dataTransfer.files);};
  function send(file, params, bar){ return new Promise((res,rej)=>{ const x=new XMLHttpRequest(); x.open('POST','/api/upload?'+new URLSearchParams(params)); x.setRequestHeader('X-Requested-With','hub'); x.setRequestHeader('Content-Type','application/octet-stream');
    x.upload.onprogress = e=>{ if(e.lengthComputable && bar) bar.style.width = Math.round(100*e.loaded/e.total)+'%'; };
    x.onload = ()=>{ let d={}; try{d=JSON.parse(x.responseText);}catch(_){} x.status===200 ? res(d) : rej(new Error(d.error||'Fehler '+x.status)); };
    x.onerror = ()=>rej(new Error('Der Server ist nicht erreichbar.')); x.send(file); }); }
  $('#uf').onsubmit = async e=>{
    e.preventDefault(); if(!files.length){ $('#u-err').textContent='Bitte zuerst eine Datei wählen.'; return; }
    if (files.length===1 && $('#u-title').value.trim().length<2){ $('#u-err').textContent='Bitte einen Titel angeben.'; return; }
    const b=$('#u-go'); b.disabled=true; $('#u-err').textContent=''; let lastId=null, fails=[];
    for (let i=0;i<files.length;i++){
      const f=files[i]; b.textContent = 'Wird hochgeladen '+(i+1)+'/'+files.length+' …';
      const bar = files.length>1 ? $('#fi'+i+' .progress i') : (()=>{ const p=$('#p1'); p.style.display='block'; return p.firstChild; })();
      const title = files.length>1 ? f.name.replace(/\.(litematic|schem|nbt)$/i,'').replace(/[_-]+/g,' ') : $('#u-title').value;
      const fmt = (f.name.match(/\.(litematic|schem|nbt)$/i)||[,'litematic'])[1].toLowerCase();
      try { const d = await send(f, {title, descr:$('#u-desc').value, tags:$('#u-tags').value, public:$('#u-pub').checked?1:0, format:fmt}, bar); lastId=d.id; if(bar) bar.style.width='100%'; }
      catch(err){ fails.push(f.name+': '+err.message); }
    }
    if (fails.length){ $('#u-err').innerHTML = fails.map(esc).join('<br>'); b.disabled=false; b.textContent='Hochladen'; if(lastId) toast((files.length-fails.length)+' hochgeladen'); return; }
    toast(files.length>1 ? files.length+' Schematics hochgeladen!' : 'Hochgeladen!'); location.hash = files.length>1 ? '#/mine' : '#/s/'+lastId;
  };
}

// ---------------------------------------------------------------- Bild-Helfer
async function imageToJpeg(file, w, h, q=0.88){
  const url = URL.createObjectURL(file);
  const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('Das Bild konnte nicht gelesen werden.')); i.src=url; });
  const c = document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d');
  const k = Math.max(w/img.width, h/img.height), sw = w/k, sh = h/k;
  x.drawImage(img, (img.width-sw)/2, (img.height-sh)/2, sw, sh, 0, 0, w, h);
  URL.revokeObjectURL(url);
  return new Promise(r=>c.toBlob(r,'image/jpeg',q));
}
function dataUrlToBlob(u){ const b=atob(u.split(',')[1]); const a=new Uint8Array(b.length); for(let i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return new Blob([a],{type:'image/jpeg'}); }
const putRaw = (path, blob) => api(path, {method:'POST', headers:{'Content-Type':'application/octet-stream'}, body: blob});

  const list = (title, items, stat) => `<div class="panel" style="padding:0;overflow:hidden"><h3 style="margin:0;padding:16px 18px 8px">${title}</h3>${items.length ? items.map((s,i)=>`<div class="rank" data-id="${s.id}"><span class="n">${i+1}</span><img ${s.cover?`src="/api/schematics/${s.id}/cover?v=${s.cover}"`:`data-th="${s.id}"`} alt=""><div class="t"><b>${esc(s.title)}</b><span class="mute" style="font-size:13px">von ${esc(s.author)}</span></div><span class="mute" style="white-space:nowrap">${stat(s)}</span></div>`).join('') : '<div class="mute" style="padding:6px 18px 18px">Noch nichts hier.</div>'}</div>`;
  const builders = `<div class="panel" style="padding:0;overflow:hidden"><h3 style="margin:0;padding:16px 18px 8px">Top-Bauer</h3>${d.builders.length ? d.builders.map((b,i)=>`<div class="rank" data-user="${esc(b.name)}"><span class="n">${i+1}</span>${avatar(b.name,'',b.av)}<div class="t"><b>${esc(b.name)}</b><span class="mute" style="font-size:13px">${b.uploads} Schematics &middot; ${num(b.downloads)} Downloads</span></div><span class="mute">♥ ${b.likes}</span></div>`).join('') : '<div class="mute" style="padding:6px 18px 18px">Noch nichts hier.</div>'}</div>`;
  $('#toprows').innerHTML = list('Diese Woche beliebt', d.liked_week, s=>'♥ '+s.likes) + list('Beste Bewertung', d.best_rated, s=>'★ '+s.rating.toFixed(1)+' ('+s.rating_n+')') + list('Meiste Downloads', d.downloads, s=>'↓ '+num(s.downloads)) + builders;
  $('#toprows').onclick = e=>{ const r=e.target.closest('.rank'); if(!r) return; location.hash = r.dataset.user ? '#/u/'+r.dataset.user : '#/s/'+r.dataset.id; };
  $$('#toprows img[data-th]').forEach(img=>thumbFor(+img.dataset.th).then(u=>{ if(u) img.src=u; }));
}
async function pageFeed(){
  if (!me) { setTitle('Feed'); $('#app').innerHTML='<div class="empty"><h2>Bitte einloggen</h2><p>Im Feed siehst du neue Schematics von Bauern, denen du folgst.</p><button class="btn pri" id="go">Einloggen</button></div>'; $('#go').onclick=()=>openAuth('login'); return; }
  let d; try { d = await api('/api/feed'); } catch(e){ $('#app').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; return; }
  gridPage('Dein <b style="color:var(--accent)">Feed</b>', d.items, 'Hier erscheinen neue Schematics von Bauern, denen du folgst. Besuche ein Profil und tippe auf &bdquo;Folgen&ldquo;.');
}
function colCard(c){
  const sq = Array.from({length:4},(_,i)=> c.covers[i] ? `<div><img data-th="${c.covers[i]}" alt=""></div>` : '<div></div>').join('');
  return `<div class="ccard" data-c="${c.id}"><div class="mosaic">${sq}</div><div class="info"><h3>${esc(c.name)}</h3><div class="meta"><span>von ${esc(c.owner)}</span><span>${c.count} Schematics</span>${c.public?'':'<span>privat</span>'}</div></div></div>`;
}
async function pageCollections(){
  setTitle('Sammlungen');
  $('#app').innerHTML = `<div class="row" style="justify-content:space-between;margin-top:34px"><h1 style="margin:0;font-size:38px">Sammlungen</h1>${me?'<button class="btn pri" id="newcol">+ Neue Sammlung</button>':''}</div><div id="mycols"></div><h3 style="margin:26px 0 0">Alle &ouml;ffentlichen Sammlungen</h3><div id="allcols" class="cgrid"><div class="skeleton"></div></div>`;
  const fill = (el, items, empty) => { el.innerHTML = items.length ? items.map(colCard).join('') : '<div class="empty" style="grid-column:1/-1;padding:30px 0">'+empty+'</div>'; $$('img[data-th]', el).forEach(img=>thumbFor(+img.dataset.th).then(u=>{ if(u) img.src=u; })); };
  try { const all = await api('/api/collections'); fill($('#allcols'), all.items, 'Noch keine Sammlungen.'); } catch(e){ $('#allcols').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
  if (me) { try { const mine = await api('/api/collections?mine=1'); $('#mycols').innerHTML = '<h3 style="margin:26px 0 0">Meine Sammlungen</h3><div id="mine2" class="cgrid"></div>'; fill($('#mine2'), mine.items, 'Du hast noch keine Sammlung. Lege eine an!'); } catch(e){} }
  $('#app').onclick = e=>{ const c=e.target.closest('.ccard'); if(c) location.hash='#/c/'+c.dataset.c; };
  const nb=$('#newcol'); if(nb) nb.onclick = ()=>{
    openBox(`<h3 style="margin-top:0">Neue Sammlung</h3><form id="nc-form" style="display:grid;gap:10px"><label>Name<input type="text" id="nc-name" maxlength="60" required></label><label>Beschreibung<textarea id="nc-desc" rows="3" maxlength="500"></textarea></label>
      <label class="row" style="grid-auto-flow:column;justify-content:start"><input type="checkbox" id="nc-pub" checked> F&uuml;r alle sichtbar</label><div class="err" id="nc-err"></div><div class="row"><button class="btn pri" type="submit">Anlegen</button><button class="btn" type="button" id="nc-cancel">Abbrechen</button></div></form>`);
    $('#nc-cancel').onclick = closeBox;
    $('#nc-form').onsubmit = async e=>{ e.preventDefault(); try{ const c=await post('/api/collections',{name:$('#nc-name').value,descr:$('#nc-desc').value,public:$('#nc-pub').checked}); closeBox(); location.hash='#/c/'+c.id; }catch(err){ $('#nc-err').textContent=err.message; } };
  };
}
async function pageCollection(id){
  let d; try { d = await api('/api/collections/'+id); } catch(e){ $('#app').innerHTML='<div class="empty"><h2>'+esc(e.message)+'</h2></div>'; return; }
  setTitle(d.name);
  $('#app').innerHTML = `<div style="padding:34px 0 0"><a href="#/collections" class="mute">&larr; Alle Sammlungen</a><div class="row" style="justify-content:space-between;align-items:flex-start;margin-top:8px"><div><h1 style="margin:0;font-size:38px">${esc(d.name)}</h1><div class="mute">von <a href="#/u/${esc(d.owner)}">${esc(d.owner)}</a> &middot; ${d.count} Schematics${d.public?'':' &middot; privat'}</div>${d.descr?`<p style="max-width:640px;white-space:pre-wrap">${esc(d.descr)}</p>`:''}</div>
    ${d.mine?'<div class="row"><button class="btn" id="col-edit">Bearbeiten</button><button class="btn dng" id="col-del">L&ouml;schen</button></div>':''}</div></div><div id="list">${d.items.length?'<div class="grid">'+d.items.map(cardHtml).join('')+'</div>':'<div class="empty">Diese Sammlung ist noch leer.</div>'}</div>`;
  const list = $('#list'); cardClicks(list); lazyThumbs(d.items);
  if (d.mine) {
    $$('.card', list).forEach(c=>c.insertAdjacentHTML('beforeend', `<button class="btn sm dng" data-rm="${c.dataset.id}" style="position:absolute;left:8px;top:8px">Entfernen</button>`));
    list.addEventListener('click', async e=>{ const b=e.target.closest('[data-rm]'); if(!b) return; e.stopPropagation(); await post('/api/collections/'+id+'/remove',{schematic_id:+b.dataset.rm}); toast('Entfernt'); pageCollection(id); }, true);
    $('#col-del').onclick = async()=>{ if(!confirm('Sammlung löschen? Die Schematics bleiben erhalten.')) return; await api('/api/collections/'+id,{method:'DELETE'}); toast('Gelöscht'); location.hash='#/collections'; };
    $('#col-edit').onclick = ()=>{
      openBox(`<h3 style="margin-top:0">Sammlung bearbeiten</h3><form id="ce-form" style="display:grid;gap:10px"><label>Name<input type="text" id="ce-name" maxlength="60" value="${esc(d.name)}" required></label><label>Beschreibung<textarea id="ce-desc" rows="3" maxlength="500">${esc(d.descr)}</textarea></label>
        <label class="row" style="grid-auto-flow:column;justify-content:start"><input type="checkbox" id="ce-pub" ${d.public?'checked':''}> F&uuml;r alle sichtbar</label><div class="err" id="ce-err"></div><div class="row"><button class="btn pri" type="submit">Speichern</button><button class="btn" type="button" id="ce-cancel">Abbrechen</button></div></form>`);
      $('#ce-cancel').onclick = closeBox;
      $('#ce-form').onsubmit = async e=>{ e.preventDefault(); try{ await post('/api/collections/'+id+'/edit',{name:$('#ce-name').value,descr:$('#ce-desc').value,public:$('#ce-pub').checked}); closeBox(); pageCollection(id); }catch(err){ $('#ce-err').textContent=err.message; } };
    };
  }
}
async function pageAdmin(){
  setTitle('Admin');
  if (!me || !me.admin) { $('#app').innerHTML='<div class="empty"><h2>Nur f&uuml;r Admins</h2></div>'; return; }
  $('#app').innerHTML = '<h1 style="margin:34px 0 14px;font-size:38px">Admin &middot; Meldungen</h1><div id="reps"><div class="skeleton" style="height:120px"></div></div>';
  async function load(){
    let d; try { d = await api('/api/admin/reports'); } catch(e){ $('#reps').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; return; }
    $('#reps').innerHTML = d.items.length ? d.items.map(r=>`<div class="panel" style="margin-bottom:12px"><div class="row" style="justify-content:space-between;align-items:flex-start"><div style="min-width:0"><b>${r.kind==='schematic'?'Schematic':'Kommentar'}: ${r.title?esc(r.title):'<i>(schon gelöscht)</i>'}</b><div class="mute" style="font-size:13px">von ${esc(r.author||'?')} &middot; gemeldet von ${esc(r.reporter)} &middot; ${ago(r.created)}</div><p style="margin:8px 0;white-space:pre-wrap">${esc(r.reason)}</p></div>
      <div class="row">${r.link?`<a class="btn sm" href="${esc(r.link)}">Ansehen</a>`:''}<button class="btn sm dng" data-del="${r.id}">Inhalt l&ouml;schen</button><button class="btn sm" data-ok="${r.id}">Ablehnen</button></div></div></div>`).join('') : '<div class="empty">Keine offenen Meldungen. \u{1F389}</div>';
  }
  $('#reps').onclick = async e=>{ const del=e.target.closest('[data-del]'), ok=e.target.closest('[data-ok]'); const b=del||ok; if(!b) return;
    if (del && !confirm('Den gemeldeten Inhalt wirklich löschen?')) return;
    await post('/api/admin/reports/'+(del?del:ok).dataset[del?'del':'ok']+'/resolve',{action: del?'delete':'dismiss'}); toast('Erledigt'); load(); };
  load();
}


function route(){
  cleanup();
  const h = location.hash || '#/';
  $$('nav a').forEach(a=>a.classList.toggle('on', a.dataset.nav===h || (a.dataset.nav==='#/' && /^#\/(s|u)\//.test(h)) || (a.dataset.nav==='#/collections' && /^#\/c\//.test(h))));
  window.scrollTo(0,0);
  let m;
  if ((m=h.match(/^#\/s\/(\d+)$/))) return pageDetail(+m[1]);
  if ((m=h.match(/^#\/u\/([A-Za-z0-9_]+)$/))) return pageList({mode:'user', user:m[1]});
  if ((m=h.match(/^#\/c\/(\d+)$/))) return pageCollection(+m[1]);
  if (h==='#/top') return pageTop();
  if (h==='#/collections') return pageCollections();
  if (h==='#/feed') return pageFeed();
  if (h==='#/admin') return pageAdmin();
  if (h==='#/upload') return pageUpload();
  if (h==='#/mod') return pageMod();
  if (h==='#/mine' || h==='#/favs') {
    if(!me){ setTitle(''); $('#app').innerHTML='<div class="empty"><h2>Bitte einloggen</h2><button class="btn pri" id="go">Einloggen</button></div>'; $('#go').onclick=()=>openAuth('login'); return; }
    return pageList({mode: h==='#/mine' ? 'mine' : 'favs'});
  }
  return pageList({mode:'home'});
}
$$('nav a').forEach(a=>a.onclick=()=>{ location.hash=a.dataset.nav; });
$('#logo').onclick=()=>{ location.hash='#/'; };
window.addEventListener('hashchange', route);
document.addEventListener('keydown', e=>{ if (e.key==='/' && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')) { const q=$('#q'); if(q){ e.preventDefault(); q.focus(); } } if (e.key==='Escape') { $('#modal').classList.remove('on'); $('#modal2').classList.remove('on'); } });
$('#theme').onclick = $('#theme').onclick;
$('#lang').onclick = ()=>setLang(LANG==='en' ? 'de' : 'en');
startI18n(); $('#lang').textContent = LANG==='en' ? 'DE' : 'EN';
(async()=>{ try{ SITE=await api('/api/info'); }catch(e){} try{ me=(await api('/api/me')).user; }catch(e){} renderAuth(); if (SITE.public) { const f=$('footer .wrap'); f.insertAdjacentHTML('beforeend','<div style="margin-top:6px">Die Vorschau nutzt selbst gezeichnete Texturen im Minecraft-Stil. Minecraft ist eine Marke von Mojang, diese Seite ist nicht mit Mojang verbunden.</div>'); } route(); })();
</script>
